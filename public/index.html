b.dataset.a='open';b.dataset.i=c.id;b.innerHTML=`<md-ripple></md-ripple><img src="${url(c)}" alt="${esc(c.name)}">`;$('#hn').textContent=`${c.name} ・ ${c.cat} ・ ${c.col}`;const t=c.note||'コメントはまだありません。タップして追加できます';const h=$('#hc');h.textContent=t;h.className='hs'+(c.note?'':' v');h.style.fontSize=t.length>24?'22px':'28px'}
/* closet */
function rCloset(){const q=$('#q').value.trim().toLowerCase(),L=D.clothes.filter(c=>(!F.size||F.has(c.cat))&&(!q||(c.name+c.note+c.col+c.cat).toLowerCase().includes(q)));
const fc=$('#fc');if(!fc.children.length)fc.innerHTML=CATS.map(c=>`<md-filter-chip label="${c}"></md-filter-chip>`).join('');
$('#cn').textContent=D.clothes.length?`${L.length}着`:'';
$('#cg').innerHTML=!D.clothes.length?'<div class="em"><md-icon>apparel</md-icon><div class="tm">服がまだ登録されていません</div><div class="bm">右下の＋から写真を追加しましょう</div></div>':!L.length?'<div class="em"><md-icon>search_off</md-icon><div class="tm">見つかりませんでした</div></div>':`<div class="grid">${L.map(c=>`<div class="card tap" data-a="open" data-i="${c.id}" role="button" tabindex="0"><md-ripple></md-ripple><img src="${url(c)}" alt=""><div class="ct"><div class="tm">${esc(c.name)}</div><div class="lm v">${c.cat} ・ ${c.col}</div></div></div>`).join('')}</div>`}
$('#q').addEventListener('input',rCloset);$('#fc').addEventListener('click',()=>{F=new Set($$('#fc md-filter-chip').filter(c=>c.selected).map(c=>c.label));rCloset()});
/* forms */
const sel=(id,l,a,v,n)=>`<md-outlined-select id="${id}" label="${l}">${a.map((x,i)=>{const val=n?i+1:x;return`<md-select-option value="${val}" ${val==v?'selected':''}><div slot="headline">${n?`${i+1} ${x}`:x}</div></md-select-option>`}).join('')}</md-outlined-select>`;
const fields=(p,c={})=>`<md-outlined-text-field id="${p}n" label="名前" maxlength="30" value="${esc(c.name)}"></md-outlined-text-field>`+sel(p+'c','カテゴリ',CATS,c.cat||CATS[0])+sel(p+'l','色',COLS,c.col||COLS[0])+sel(p+'w','あったかさ',WM,c.w||3,1)+`<md-outlined-text-field id="${p}m" label="コメント" type="textarea" rows="3" maxlength="200" value="${esc(c.note)}"></md-outlined-text-field>`;
function rf(p){const n=$('#'+p+'n'),v=n.value.trim();n.error=!v;n.errorText=v?'':'名前を入力してください';if(!v){n.focus();return null}return{name:v,cat:$('#'+p+'c').value,col:$('#'+p+'l').value,w:+$('#'+p+'w').value,note:$('#'+p+'m').value.trim()}}
$('#uf').innerHTML=fields('u');
async function shrink(f){const b=await createImageBitmap(f),r=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise((ok,ng)=>c.toBlob(x=>x?ok(x):ng(new Error('blob')),'image/jpeg',.85))}
const onImg=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/'))return snack('画像ファイルを選んでください');try{UP=await shrink(f);$('#ub').classList.remove('err');$('#ub').innerHTML=`<md-ripple></md-ripple><img src="${URL.createObjectURL(UP)}" alt="プレビュー">`;if(T!=3)go(3)}catch(x){snack('この画像は読み込めませんでした')}};$('#fp').onchange=$('#fcam').onchange=onImg;
/* chat */
const QC=['今日のコーデ','暑い日のコーデ','寒い日のコーデ','雨の日のコーデ'];
$('#qc').innerHTML=QC.map(q=>`<md-assist-chip label="${q}" data-q="${q}"></md-assist-chip>`).join('');
function advise(q){const L=D.clothes;if(!L.length)return{t:'まだ服が登録されていません。「アップロード」から写真を追加すると、手持ちの服でコーデを考えます。'};
const t=/暑|夏|半袖/.test(q)?1.5:/寒|冬|雪|コート/.test(q)?4.5:/涼|秋|春|肌寒|朝晩/.test(q)?3.5:3,by=cat=>L.filter(c=>c.cat==cat).map(c=>({c,s:Math.abs(c.w-t)+Math.random()*.9})).sort((a,b)=>a.s-b.s)[0]?.c;
const o={top:by('トップス'),bottom:by('ボトムス'),outer:(t>=2.5||/羽織|上着|アウター/.test(q))?by('アウター'):null,shoes:by('シューズ')},l=Object.values(o).filter(Boolean);
if(!l.length)return{t:'トップスやボトムスなど、コーデに使える服がまだありません。'};
let s=`「${l.map(c=>c.name).join('」+「')}」はどうかな。`;if(!o.top||!o.bottom)s+=`\n${o.top?'ボトムス':'トップス'}が未登録なので、あるものだけで考えました。`;if(/雨|傘/.test(q))s+='\n雨なら濡れてもいい靴と傘を忘れずに。';return{t:s,ids:l.map(c=>c.id)}}
function rChat(){const l=$('#cl');l.innerHTML=D.chat.length?D.chat.map(m=>`<div class="m ${m.r} bm">${esc(m.t)}${m.ids?`<div class="th">${m.ids.map(i=>D.clothes.find(c=>c.id==i)).filter(Boolean).map(c=>`<img src="${url(c)}" alt="${esc(c.name)}">`).join('')}</div>`:''}</div>`).join(''):'<div class="em" style="margin:auto"><md-icon>sms</md-icon><div class="tm">コーデ相談</div><div class="bm">手持ちの服から今日の一着を考えます</div></div>';l.scrollTop=l.scrollHeight}
async function send(t){t=(t||$('#ci').value).trim();if(!t)return;$('#ci').value='';await fail(async()=>{const a=advise(t);for(const m of [{r:'u',t},{r:'b',...{t:a.t,ids:a.ids}}]){m.id=await put('chat',m);D.chat.push(m)}rChat()})}
$('#ci').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}});$('#qc').addEventListener('click',e=>{const q=e.target.closest('[data-q]');q&&send(q.dataset.q)});
/* shop */
function rShop(){const L=[...D.wish].sort((a,b)=>a.done-b.done||b.ts-a.ts),tot=L.filter(w=>!w.done).reduce((s,w)=>s+(w.price||0),0);$('#wtot').textContent=L.some(w=>!w.done&&w.price)?`合計 ${yen(tot)}`:'';
$('#wl').innerHTML=L.length?L.map(w=>`<div class="wr ${w.done?'dn':''}"><md-checkbox touch-target="wrapper" data-w="${w.id}" ${w.done?'checked':''} aria-label="購入済み"></md-checkbox><div class="wt" data-a="wedit" data-i="${w.id}"><div class="tm">${esc(w.name)}</div><div class="bm v">${w.price?yen(w.price):'予算未設定'}</div></div>${w.url?`<md-icon-button href="${esc(w.url)}" target="_blank" aria-label="開く"><md-icon>open_in_new</md-icon></md-icon-button>`:''}<md-icon-button data-a="wdel" data-i="${w.id}" aria-label="削除"><md-icon>delete</md-icon></md-icon-button></div>`).join(''):'<div class="em"><md-icon>shopping_cart</md-icon><div class="tm">ほしい物はまだありません</div><div class="bm">右下の「追加」から登録しましょう</div></div>'}
$('#wl').addEventListener('change',async e=>{const w=D.wish.find(x=>x.id==e.target.dataset.w);if(!w)return;w.done=e.target.checked;await fail(()=>put('wish',w));rShop()});
function wopen(w){WE=w||null;$('#wdt').textContent=w?'ほしい物を編集':'ほしい物を追加';$('#wn').value=w?.name||'';$('#wp').value=w?.price||'';$('#wu').value=w?.url||'';['#wn','#wp','#wu'].forEach(i=>$(i).error=false);$('#wd').show()}
$('#wf').onsubmit=e=>{e.preventDefault();wsave()};
async function wsave(){const n=$('#wn'),p=$('#wp'),u=$('#wu'),nm=n.value.trim(),pr=p.value===''?0:Number(p.value),ur=u.value.trim();let bad=0;
n.error=!nm;n.errorText=nm?'':'名前を入力してください';p.error=!(pr>=0&&Number.isFinite(pr));p.errorText=p.error?'0以上の数字を入力してください':'';u.error=!!ur&&!/^https?:\/\/\S+$/.test(ur);u.errorText=u.error?'http:// または https:// で始まるURLを入力してください':'';
if(n.error||p.error||u.error)return;const w=WE||{id:crypto.randomUUID(),done:false,ts:Date.now()};Object.assign(w,{name:nm,price:Math.round(pr),url:ur});await fail(async()=>{await put('wish',w);if(!WE)D.wish.push(w);$('#wd').close('ok');rShop();snack('保存しました')})}
/* sub screens (history-backed) */
function showSub(s,p){const sb=$('#sub');let t='',a='',b='';
if(s=='d'){const c=D.clothes.find(x=>x.id==p);if(!c)return;t=c.name;a='<md-icon-button data-a="cdel" aria-label="削除"><md-icon class="dg">delete</md-icon></md-icon-button>';b=`<div class="imgbox sq"><img src="${url(c)}" alt=""></div><div class="form">${fields('e',c)}<md-filled-tonal-button data-a="today"><md-icon slot="icon">today</md-icon>今日の一着にする</md-filled-tonal-button><md-filled-button data-a="esave"><md-icon slot="icon">check</md-icon>保存</md-filled-button></div>`;sb.dataset.i=p}
if(s=='p'){t='プロフィール';b=`<div class="form"><div class="em" style="padding:8px"><md-icon style="font-size:72px;width:72px;height:72px" class="f">account_circle</md-icon></div><md-outlined-text-field id="pn" label="ニックネーム" maxlength="20" value="${esc(D.meta.name?.v)}"></md-outlined-text-field><div class="bm v">服 ${D.clothes.length}着 ・ ほしい物 ${D.wish.length}件</div><md-filled-button data-a="psave">保存</md-filled-button></div>`}
if(s=='s'){t='設定';b=`<md-list><md-list-item type="button" data-a="exp"><md-icon slot="start">download</md-icon><div slot="headline">データを書き出す</div><div slot="supporting-text">服・ほしい物・チャットをJSONで保存</div></md-list-item><md-list-item type="button" data-a="wipe"><md-icon slot="start" class="dg">delete_forever</md-icon><div slot="headline" class="dg">すべてのデータを削除</div><div slot="supporting-text">この端末に保存された内容を消去します</div></md-list-item></md-list><div class="bm v" style="padding:16px">データはこの端末のブラウザ内にのみ保存されます。</div>`}
sb.innerHTML=`<div class="tb"><md-icon-button data-a="back" aria-label="戻る"><md-icon>arrow_back</md-icon></md-icon-button><div class="tl" style="text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(t)}</div>${a}</div><div class="sb">${b}</div>`;sb.classList.toggle('l',s=='p');sb.offsetWidth;sb.classList.add('on')}
const hideSub=()=>$('#sub').classList.remove('on'),push=(s,p)=>{history.pushState({s,p},'');showSub(s,p)};
history.replaceState(null,'');addEventListener('popstate',e=>e.state&&e.state.s?showSub(e.state.s,e.state.p):hideSub());
/* actions */
const A={back:()=>history.back(),open:i=>push('d',i),prof:()=>push('p'),set:()=>push('s'),goup:()=>go(3),add:()=>$('#ad').show(),adx:()=>$('#ad').close(),cam:()=>{$('#ad').close();$('#fcam').click()},lib:()=>{$('#ad').close();$('#fp').click()},wadd:()=>wopen(),wx:()=>$('#wd').close(),ws:wsave,pick:()=>$('#fp').click(),send:()=>send(),
wedit:i=>wopen(D.wish.find(w=>w.id==i)),
async wdel(i){const w=D.wish.find(x=>x.id==i);if(w&&await ask('削除しますか?',`「${w.name}」をリストから削除します。`,'削除',1))await fail(async()=>{await del('wish',i);D.wish=D.wish.filter(x=>x.id!=i);rShop();snack('削除しました')})},
async clr(){if(D.chat.length&&await ask('履歴を消しますか?','チャットの履歴をすべて削除します。','削除',1))await fail(async()=>{await clr('chat');D.chat=[];rChat();snack('履歴を消しました')})},
async up(){const v=rf('u');if(!UP){$('#ub').classList.add('err');snack('写真を選んでください');if(v)return;return}if(!v)return;await fail(async()=>{const c={id:crypto.randomUUID(),img:UP,ts:Date.now(),...v};await put('clothes',c);D.clothes.push(c);UP=null;$('#ub').innerHTML='<md-ripple></md-ripple><div class="em"><md-icon>add_a_photo</md-icon><div class="bm">写真を選ぶ・撮る</div></div>';$('#uf').innerHTML=fields('u');snack('登録しました');go(1)})},
async esave(){const v=rf('e'),c=D.clothes.find(x=>x.id==$('#sub').dataset.i);if(!v||!c)return;await fail(async()=>{Object.assign(c,v);await put('clothes',c);rHome();rCloset();snack('保存しました');history.back()})},
async today(){const c=D.clothes.find(x=>x.id==$('#sub').dataset.i);D.meta.pick={k:'pick',d:new Date().toDateString(),id:c.id};await fail(()=>put('meta',D.meta.pick));rHome();snack('今日の一着に設定しました')},
async cdel(){const c=D.clothes.find(x=>x.id==$('#sub').dataset.i);if(c&&await ask('この服を削除しますか?',`「${c.name}」を削除します。元に戻せません。`,'削除',1))await fail(async()=>{await del('clothes',c.id);D.clothes=D.clothes.filter(x=>x.id!=c.id);history.back();R();snack('削除しました')})},
async psave(){const v=$('#pn').value.trim();D.meta.name={k:'name',v};await fail(()=>put('meta',D.meta.name));snack('保存しました')},
async exp(){const d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});await fail(async()=>{const cl=await Promise.all(D.clothes.map(async c=>({...c,img:await d(c.img)}))),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,clothes:cl,wish:D.wish,chat:D.chat})],{type:'application/json'}));a.download='coordy-backup.json';a.click();snack('書き出しました')})},
async wipe(){if(await ask('すべて削除しますか?','服・ほしい物・チャット・プロフィールをすべて消去します。元に戻せません。','すべて削除',1))await fail(async()=>{for(const n of['clothes','chat','wish','meta'])await clr(n);D.clothes=[];D.chat=[];D.wish=[];D.meta={};history.back();R();snack('削除しました')})}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.i)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('card')){e.preventDefault();e.target.click()}});
$('#hs').onclick=()=>rHome(1);
/* boot */
(async()=>{try{const[c,h,w,m]=await Promise.all([all('clothes'),all('chat'),all('wish'),all('meta')]);D.clothes=c.sort((a,b)=>b.ts-a.ts);D.chat=h;D.wish=w;m.forEach(x=>D.meta[x.k]=x)}catch(e){snack('この環境ではデータを保存できません')}R()})();
</script></body></html>
